apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sammed-sankonatti/tf-k8s-three-gitops.git
    targetRevision: HEAD
    path: apps/api

  destination:
    server: https://kubernetes.default.svc
    namespace: api

  syncPolicy:
    automated:
      prune: true # delete resources removed from git
      selfHeal: true # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
