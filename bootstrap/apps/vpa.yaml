apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 4.7.0
    helm:
      values: |
        recommender:
          enabled: true
        # Not needed in Off mode -- the updater evicts pods to apply
        # recommendations, and the admission controller rewrites
        # requests on pod creation. Both off keeps this read-only.
        updater:
          enabled: false
        admissionController:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: vpa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
