apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore

  target:
    name: db-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.secretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn }}
        property: password