apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore

  target:
    name: db-credentials
    creationPolicy: Owner

  # Matches whatever RDS-managed secret exists, regardless of the
  # random suffix AWS generates on each rebuild. Replaces the
  # hardcoded ARN, which broke every time RDS was recreated.
  dataFrom:
    - find:
        name:
          regexp: "^rds!db-"
      rewrite:
        - regexp:
            source: ".*"
            target: "RDS_CREDENTIALS"
