{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip target-type routes straight to pod IPs. instance mode would
    # go via NodePort, an extra hop.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Ingresses sharing a group name share one ALB, so the UI attaches
    # to this one later instead of provisioning a second.
    alb.ingress.kubernetes.io/group.name: tf-k8s-three-prod
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.service.port }}
          - path: /lti
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.service.port }}
          - path: /other
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: {{ .Values.service.port }}
{{- end }}