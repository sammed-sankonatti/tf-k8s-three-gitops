name: build and push

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read
    id-token: write

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm test

            - name: configure aws credentials
              if: github.ref == 'refs/heads/main'
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: login to ecr
              if: github.ref == 'refs/heads/main'
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: build and push
              if: github.ref == 'refs/heads/main'
              env:
                  REGISTRY: ${{ steps.ecr.outputs.registry }}
                  REPOSITORY: ${{ vars.ECR_REPOSITORY }}
                  TAG: ${{ github.sha }}
              run: |
                  docker build -t "$REGISTRY/$REPOSITORY:$TAG" .
                  docker push "$REGISTRY/$REPOSITORY:$TAG"

            - name: update gitops repo
              if: github.ref == 'refs/heads/main'
              env:
                  TAG: ${{ github.sha }}
                  GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
              run: |
                  git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/sammed-sankonatti/tf-k8s-three-gitops.git" gitops
                  cd gitops
                  git config user.name "api-ci"
                  git config user.email "api-ci@users.noreply.github.com"

                  for i in 1 2 3 4 5; do
                    git pull --rebase
                    sed -i "s|^  tag: .*|  tag: ${TAG}|" apps/api/values.yaml

                    if git diff --quiet; then
                      echo "tag already ${TAG}"
                      exit 0
                    fi

                    git commit -am "api: deploy ${TAG}"
                    if git push; then exit 0; fi
                    sleep $((RANDOM % 5 + 2))
                  done
                  echo "failed to push after 5 attempts"
                  exit 1
